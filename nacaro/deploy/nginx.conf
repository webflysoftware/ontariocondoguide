# NACARO — production nginx configuration (Nuxt SSR via reverse proxy)
#
# App: systemd nacaro.service → 127.0.0.1:3090
# Build output: /var/www/nacaro (contents of nacaro/.output/)
#
# TLS: certbot certonly --nginx -d nacaro.org -d www.nacaro.org

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nacaro.org www.nacaro.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nacaro.org$request_uri;
    }
}

# Redirect www to apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nacaro.org;

    ssl_certificate     /etc/letsencrypt/live/nacaro.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nacaro.org/privkey.pem;

    return 301 https://nacaro.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nacaro.org;

    ssl_certificate     /etc/letsencrypt/live/nacaro.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nacaro.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Nuxt hashed client assets
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
